<!doctype html>
<html lang="en" data-theme="light" data-content-width="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ brand }} — serve-md</title>
    <script>
      // Apply saved theme immediately to prevent flash of wrong theme
      (function () {
        var saved = localStorage.getItem("serve-md-theme");
        var theme = saved === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();

      // Apply saved content width immediately to prevent layout flash
      (function () {
        var saved = localStorage.getItem("serve-md-content-width");
        var width =
          saved === "comfortable" || saved === "wide" || saved === "full"
            ? saved
            : "comfortable";
        document.documentElement.setAttribute("data-content-width", width);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui/styles.css" />
    <script>
      // Set correct hljs theme before paint
      (function () {
        var saved = localStorage.getItem("serve-md-theme");
        var theme = saved === "dark" ? "dark" : "light";
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.id = "hljs-theme";
        link.href =
          theme === "dark" ? "/ui/hljs-dark.css" : "/ui/hljs-light.css";
        document.head.appendChild(link);
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ["selector"],
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              border: "var(--border)",
              bg: "var(--bg)",
              fg: "var(--fg)",
              muted: "var(--muted)",
              "code-bg": "var(--code-bg)",
              accent: "var(--accent)",
              hover: "var(--hover)",
              selected: "var(--selected)",
              "topbar-bg": "var(--topbar-bg)",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>
      // Initialize mermaid with current theme
      mermaid.initialize({
        startOnLoad: false,
        theme:
          document.documentElement.getAttribute("data-theme") === "dark"
            ? "dark"
            : "default",
      });
    </script>
  </head>
  <body
    class="bg-bg text-fg font-sans antialiased h-screen flex flex-col overflow-hidden"
  >
    <header
      class="topbar flex items-center justify-between px-4 h-12 border-b border-border bg-topbar-bg flex-shrink-0 z-10"
    >
      <div class="flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-accent"
        >
          <path
            d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
          />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <span class="font-semibold text-sm">{{ brand }}</span>
      </div>
      <div class="topbar-actions flex items-center gap-2">
        <!-- Content width presets -->
        <div
          id="content-width-control"
          class="content-width-control"
          role="group"
          aria-label="Content width"
        >
          <button
            type="button"
            class="content-width-btn is-active"
            data-width="comfortable"
            title="Comfortable"
            aria-label="Content width: Comfortable"
            aria-pressed="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <!-- narrow column -->
              <rect x="8" y="4" width="8" height="16" rx="1" />
            </svg>
          </button>
          <button
            type="button"
            class="content-width-btn"
            data-width="wide"
            title="Wide"
            aria-label="Content width: Wide"
            aria-pressed="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <!-- medium column -->
              <rect x="5" y="4" width="14" height="16" rx="1" />
            </svg>
          </button>
          <button
            type="button"
            class="content-width-btn"
            data-width="full"
            title="Full width"
            aria-label="Content width: Full"
            aria-pressed="false"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <!-- full column -->
              <rect x="3" y="4" width="18" height="16" rx="1" />
            </svg>
          </button>
        </div>
        <button
          id="theme-toggle"
          class="icon-btn p-1.5 rounded-md hover:bg-hover transition-colors"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          <svg
            id="theme-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
        </button>
      </div>
    </header>

    <main class="layout flex-1 flex min-h-0">
      <aside
        class="sidebar w-72 border-r border-border bg-topbar-bg flex-shrink-0 flex flex-col"
      >
        <div class="p-3 border-b border-border">
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="absolute left-2.5 top-2.5 text-muted"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              id="search-input"
              type="text"
              placeholder="Filter files…"
              autocomplete="off"
              class="w-full pl-8 pr-3 py-2 text-sm border border-border rounded-md bg-bg text-fg placeholder-muted focus:outline-none focus:ring-1 focus:ring-accent focus:border-accent transition-all"
            />
          </div>
        </div>
        <div id="browse-tree" class="tree flex-1 overflow-y-auto p-2"></div>
        <p id="browse-empty" class="empty text-sm text-muted px-4 py-2 hidden">
          No content files.
        </p>
      </aside>
      <div class="content-wrapper flex-1 flex flex-col relative min-h-0">
        <section class="content flex-1 overflow-y-auto p-8">
          <div id="content-host" class="content-host mx-auto">
            <div
              class="flex items-center justify-center h-full text-muted text-sm"
            >
              <div class="text-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="48"
                  height="48"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="mx-auto mb-3 opacity-50"
                >
                  <path
                    d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
                  />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
                <p>Select a file to read</p>
              </div>
            </div>
          </div>
        </section>
        <button
          type="button"
          id="scroll-top-btn"
          class="scroll-top-btn hidden"
          aria-label="Scroll to top"
          title="Scroll to top"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m18 15-6-6-6 6" />
          </svg>
        </button>
      </div>
      <aside
        id="toc-panel"
        class="toc-panel hidden"
        aria-label="Table of contents"
      >
        <div class="toc-header">On this page</div>
        <nav id="toc-nav" class="toc-nav"></nav>
      </aside>
    </main>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
